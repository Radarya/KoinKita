<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIKO (KoinKita) — 7s Startup Showreel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0D1117;
      --alabaster: #FAFAFA;
      --tone: #F4F5F7;
      --emerald: #10B981;
      --emerald-dark: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D1117;
      color: #FAFAFA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    body.headless-capture {
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: #0D1117;
    }
    body.headless-capture .controls-bar {
      display: none !important;
    }
    body.headless-capture .stage-wrap {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
    }
    .stage-wrap {
      position: relative;
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      background: #0D1117;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-wrap.vertical {
      max-width: 420px;
      aspect-ratio: 9 / 16;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-bar {
      margin-top: 18px;
      background: #161B22;
      padding: 12px 20px;
      border-radius: 999px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 1040px;
      width: 100%;
      justify-content: space-between;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button, a.dl-btn {
      appearance: none;
      border: none;
      background: #21262D;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    button:hover, a.dl-btn:hover {
      background: #30363D;
    }
    button.primary, a.dl-btn.primary {
      background: #10B981;
      color: #0D1117;
    }
    button.primary:hover, a.dl-btn.primary:hover {
      background: #059669;
      color: #FFFFFF;
    }
    button.active {
      background: #FAFAFA;
      color: #0D1117;
    }
    .scrubber-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #10B981;
      cursor: pointer;
    }
    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
      min-width: 92px;
      text-align: right;
    }
  </style>
</head>

    window.isWatermarkReady = () => jvcLogoLoaded && jvcLogoImg.naturalWidth > 0;
    let currentAspect = '16:9';
    let isPlaying = true;
    let isMuted = false;
    let currentTime = 0;

    // --- MATH & EASING HELPERS ---
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const progress = (t, start, dur) => clamp((t - start) / dur, 0, 1);
    const lerp = (a, b, p) => a + (b - a) * p;
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeOutQuart = (x) => 1 - Math.pow(1 - x, 4);
    const easeInOutCubic = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const easeOutBack = (x) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };
    const springPop = (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      return 1 - Math.exp(-6.5 * x) * Math.cos(11 * x);
    };

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function fillPill(ctx, x, y, w, h, r, fillStyle) {
      ctx.fillStyle = fillStyle;
      roundRect(ctx, x, y, w, h, r);
      ctx.fill();
    }

    // --- OFFICIAL CIKO MASCOT FLAT-VECTOR RENDERER (Exact coordinates from CikoMascot.tsx) ---
    function drawCikoMascot(ctx, cx, cy, size, pose = 'hero', t = 0, scaleX = 1, scaleY = 1) {
      ctx.save();
      ctx.translate(cx, cy);
      const bobY = Math.sin(t * 5.2) * (size * 0.025);
      ctx.translate(0, bobY);
      ctx.scale((size / 200) * scaleX, (size / 200) * scaleY);
      ctx.translate(-100, -100);

      // 1. JENGGER (Red 3-puff crest on head)
      ctx.fillStyle = '#DC2626';
      ctx.beginPath(); ctx.arc(118, 38, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#EF4444';
      ctx.beginPath(); ctx.arc(100, 30, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#DC2626';
      ctx.beginPath(); ctx.arc(84, 39, 13, 0, Math.PI * 2); ctx.fill();

      // 2. CHUBBY ROUND HEAD
      ctx.fillStyle = '#F59E0B';
      ctx.beginPath(); ctx.ellipse(100, 102, 68, 60, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FBBF24';
      ctx.beginPath(); ctx.ellipse(100, 100, 66, 58, 0, 0, Math.PI * 2); ctx.fill();

      // Cheeks
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#FB923C';
      ctx.beginPath(); ctx.arc(56, 115, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(144, 115, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 3. BIG SPARKLING ANIME EYES
      const drawEye = (ex, ey, pupilOffsetX) => {
        ctx.save();
        ctx.translate(ex, ey);
        // White sclera
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(0, 0, 23, 0, Math.PI * 2); ctx.fill();
        // Vibrant blue iris
        ctx.fillStyle = '#0284C7';
        ctx.beginPath(); ctx.arc(pupilOffsetX * 0.5, 0, 20, 0, Math.PI * 2); ctx.fill();
        // Pupil core
        ctx.fillStyle = '#0A0F1D';
        ctx.beginPath(); ctx.arc(pupilOffsetX, 1, 14, 0, Math.PI * 2); ctx.fill();
        // Big top-left highlight
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(-4, -4, 7, 0, Math.PI * 2); ctx.fill();
        // Bottom-right 4-point star twinkle
        ctx.save();
        ctx.translate(6, 6);
        const starScale = 1 + 0.18 * Math.sin(t * 10);
        ctx.scale(starScale, starScale);
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(1.2, -1.2);
        ctx.lineTo(4, 0);
        ctx.lineTo(1.2, 1.2);
        ctx.lineTo(0, 4);
        ctx.lineTo(-1.2, 1.2);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-1.2, -1.2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        // Tiny accent spark

            fillPill(ctx, tx, wy, tw, 58 * u, 18 * u, '#FFFFFF');
            ctx.fillStyle = '#0D1117';
            ctx.font = `700 ${19 * u}px 'Inter', sans-serif`;
            ctx.fillText('"Investasi Pasti Untung 80% / Minggu"', tx + 18 * u, wy + 30 * u);

            if (localP > 0.15) {
              const stampP = springPop(clamp((localP - 0.15) / 0.5, 0, 1));
              ctx.save();
              ctx.translate(tx + tw - 135 * u, wy + 86 * u);
              ctx.scale(stampP, stampP);
              fillPill(ctx, -135 * u, -22 * u, 270 * u, 44 * u, 22 * u, '#E11D48');
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `800 ${17 * u}px 'Inter', sans-serif`;
              ctx.textAlign = 'center';
              ctx.fillText('🛡️ SCAM TERDETEKSI!', 0, 1 * u);
              ctx.restore();
            }
          } else if (i === 2) {
            // FinWordle: 5 letter tiles S - A - H - A - M
            const letters = ['S', 'A', 'H', 'A', 'M'];
            const tileS = 64 * u;
            letters.forEach((ch, li) => {
              const lp = clamp((localP - li * 0.1) / 0.4, 0, 1);
              const lx = tx + li * (tileS + 10 * u);
              fillPill(ctx, lx, wy, tileS, tileS, 16 * u, lp > 0.3 ? '#10B981' : '#FFFFFF');
              ctx.fillStyle = lp > 0.3 ? '#FFFFFF' : '#0D1117';
              ctx.font = `900 ${30 * u}px 'Poppins', sans-serif`;
              ctx.textAlign = 'center';
              ctx.fillText(ch, lx + tileS / 2, wy + tileS / 2 + 2 * u);
            });
            ctx.textAlign = 'left';
            ctx.fillStyle = '#4F46E5';
            ctx.font = `800 ${19 * u}px 'Inter', sans-serif`;
            ctx.fillText('✓ Istilah Terjawab · Streak Kuis +1', tx, wy + 96 * u);
          } else if (i === 3) {
            // Pohon Aset: Compounding Dividend Meter
            fillPill(ctx, tx, wy, tw, 46 * u, 23 * u, '#FFFFFF');
            const fillW = Math.max(46 * u, tw * easeOutCubic(localP));
            fillPill(ctx, tx, wy, fillW, 46 * u, 23 * u, '#10B981');
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `800 ${19 * u}px 'Inter', sans-serif`;
            ctx.fillText(`🌱 Portofolio Tumbuh +${Math.round(lerp(12, 128, easeOutCubic(localP)))}%`, tx + 22 * u, wy + 24 * u);

            ctx.fillStyle = '#059669';
            ctx.font = `800 ${19 * u}px 'Inter', sans-serif`;
            ctx.fillText('✓ Panen Dividen & Naik Kasta Liga', tx, wy + 80 * u);
          }

          ctx.restore();
        });
      }

      // =========================================================================
      // SCENE 4 (5.30s - 7.00s): HIGH-IMPACT STARTUP FINALE & CTA LOCKUP
      // =========================================================================
      else {
        // Smooth shutter transition into #0D1117
        ctx.fillStyle = '#0D1117';
        ctx.fillRect(0, 0, W, H);

        const pFinal = springPop(progress(t, 5.30, 0.50));
        const pCta = springPop(progress(t, 5.55, 0.48));

        // Subtle solid tone step card behind hero lockup
        const panelW = (isVert ? 920 : 1540) * u;
        const panelH = (isVert ? 1420 : 840) * u;
        fillPill(ctx, (W - panelW) / 2, (H - panelH) / 2, panelW, panelH, 64 * u, '#161B22');

        // Official CIKO Mascot in Wealth Crown Pose
        const mascotY = isVert ? 470 * u : 310 * u;
        drawCikoMascot(ctx, W / 2, mascotY, (isVert ? 340 : 270) * u * pFinal, 'wealth', t);

        // Floating flat gold coins flanking CIKO
        drawFlatCoin(ctx, W / 2 - (isVert ? 270 : 340) * u, mascotY - 30 * u, 38 * u * pCta);
        drawFlatCoin(ctx, W / 2 + (isVert ? 270 : 340) * u, mascotY + 20 * u, 44 * u * pCta);

        // Brand pill tag
        const tagW = 360 * u;
        const tagH = 52 * u;
        const tagY = isVert ? 700 * u : 485 * u;
        fillPill(ctx, (W - tagW) / 2, tagY, tagW, tagH, 26 * u, '#21262D');
        ctx.fillStyle = '#10B981';
        ctx.font = `800 ${20 * u}px 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('CIKO · KOINKITA EDUGAME', W / 2, tagY + tagH / 2 + 1);

        // Main Finale Headline: "Main. Belajar. Makin Cuan."
        ctx.save();
        ctx.translate(W / 2, (isVert ? 850 : 605) * u + (1 - pFinal) * 35 * u);
        ctx.fillStyle = '#FAFAFA';
        ctx.font = `900 ${(isVert ? 68 : 88) * u}px 'Poppins', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (isVert) {
          ctx.fillText('Main. Belajar.', 0, -42 * u);
          ctx.fillStyle = '#10B981';
          ctx.fillText('Makin Cuan.', 0, 48 * u);
        } else {
          ctx.fillText('Main. Belajar. Makin Cuan.', 0, 0);
        }
        ctx.restore();

        // Subtitle feature summary
        ctx.fillStyle = '#94A3B8';
        ctx.font = `600 ${(isVert ? 28 : 30) * u}px 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(
          '4 Simulasi Finansial  ·  Arena Liga Mingguan  ·  Misi Klub',
          W / 2,
          (isVert ? 1015 : 695) * u
        );

        // Solid Emerald Rounded-Full CTA Button
        const btnW = (isVert ? 680 : 620) * u;
        const btnH = (isVert ? 112 : 98) * u;
        const btnY = (isVert ? 1190 : 815) * u;
        const pulse = 1 + 0.022 * Math.sin((t - 5.6) * 8);

        ctx.save();
        ctx.translate(W / 2, btnY);
        ctx.scale(pCta * pulse, pCta * pulse);
        fillPill(ctx, -btnW / 2, -btnH / 2, btnW, btnH, btnH / 2, '#10B981');
        ctx.fillStyle = '#0D1117';
        ctx.font = `900 ${(isVert ? 36 : 34) * u}px 'Poppins', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Mulai Gratis di koinkita.xyz  →', 0, 2 * u);
        ctx.restore();
      }

      // =========================================================================
      // PERSISTENT FOREGROUND WATERMARK: #JuaraVibeCoding Official Logo
      // Positioned on the lower-left side, inset from the corner
      // =========================================================================
      if (jvcLogoLoaded || (jvcLogoImg.complete && jvcLogoImg.naturalWidth > 0)) {
        ctx.save();
        const wmW = (isVert ? 335 : 340) * u;
        const wmH = wmW * (240 / 638);
        const wmX = (isVert ? 105 : 140) * u;
        const wmY = H - wmH - (isVert ? 115 : 64) * u;
        ctx.globalAlpha = 0.96;
        ctx.drawImage(jvcLogoImg, wmX, wmY, wmW, wmH);
        ctx.restore();
      }
    }

    // --- WEB AUDIO SYNTHESIZER FOR INTERACTIVE BROWSER PLAYBACK ---
    let audioCtx = null;
    function playSynthTone(freq, dur = 0.14, type = 'triangle', gainVal = 0.12) {
      if (isMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const soundCues = [
      { t: 0.05, fn: () => playSynthTone(220, 0.16, 'triangle', 0.14) },
      { t: 0.30, fn: () => playSynthTone(277.18, 0.16, 'triangle', 0.14) },
      { t: 0.48, fn: () => playSynthTone(329.63, 0.22, 'sine', 0.16) },
      { t: 0.95, fn: () => playSynthTone(440, 0.25, 'sine', 0.14) },
      { t: 1.26, fn: () => { playSynthTone(523.25, 0.22, 'triangle', 0.15); setTimeout(() => playSynthTone(659.25, 0.25, 'triangle', 0.15), 70); } },
      { t: 2.36, fn: () => playSynthTone(587.33, 0.18, 'triangle', 0.14) },
      { t: 3.09, fn: () => playSynthTone(659.25, 0.18, 'triangle', 0.14) },
      { t: 3.81, fn: () => playSynthTone(783.99, 0.18, 'triangle', 0.14) },
      { t: 4.53, fn: () => playSynthTone(880, 0.22, 'triangle', 0.15) },
      { t: 5.32, fn: () => {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playSynthTone(f, 0.55, 'sine', 0.11), i * 45));
      }}
    ];

    function setAspect(aspect) {
      currentAspect = aspect;
      if (aspect === '9:16') {
        canvas.width = 1080;
        canvas.height = 1920;
        stageWrap.classList.add('vertical');
        aspect9x16Btn.classList.add('active');
        aspect16x9Btn.classList.remove('active');
      } else {
        canvas.width = 1920;
        canvas.height = 1080;
        stageWrap.classList.remove('vertical');
        aspect16x9Btn.classList.add('active');
        aspect9x16Btn.classList.remove('active');
      }
      renderScene(currentTime);
    }

    // Exposed deterministic hook for Headless Chrome 60fps MP4 frame capture
    window.prepareHeadlessCapture = (aspect) => {
      document.body.classList.add('headless-capture');
      isPlaying = false;
      isMuted = true;
      setAspect(aspect);
    };

    window.renderFrameAt = (t) => {
      currentTime = clamp(t, 0, DURATION);
      renderScene(currentTime);
      return canvas.toDataURL('image/jpeg', 0.96);
    };

    // Animation loop for interactive viewing
    function tick(ts) {
      if (!lastTimestamp) lastTimestamp = ts;
      const dt = (ts - lastTimestamp) / 1000;
      lastTimestamp = ts;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime >= DURATION) {
          currentTime = 0;
          triggeredCues.clear();
        }
        soundCues.forEach((cue, idx) => {
          if (currentTime >= cue.t && !triggeredCues.has(idx)) {
            triggeredCues.add(idx);
            cue.fn();
          }
        });
        scrubber.value = currentTime.toFixed(3);
        timeReadout.textContent = `${currentTime.toFixed(2)}s / 7.00s`;
        renderScene(currentTime);
      }
      requestAnimationFrame(tick);
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    });

    restartBtn.addEventListener('click', () => {
      currentTime = 0;
      triggeredCues.clear();
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      renderScene(0);
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇 Muted' : '🔊 Sound On';
    });

    scrubber.addEventListener('input', (e) => {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      currentTime = parseFloat(e.target.value);
      timeReadout.textContent = `${currentTime.toFixed(2)}s / 7.00s`;
      renderScene(currentTime);
    });

    aspect16x9Btn.addEventListener('click', () => setAspect('16:9'));
    aspect9x16Btn.addEventListener('click', () => setAspect('9:16'));

    renderScene(0);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
